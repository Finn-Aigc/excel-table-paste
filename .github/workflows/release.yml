name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Verify tag matches plugin versions
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME;
            const manifest = require("./manifest.json").version;
            const pkg = require("./package.json").version;
            const lock = require("./package-lock.json").version;
            const versions = require("./versions.json");
            const problems = [];
            if (manifest !== tag) problems.push(`manifest.json version ${manifest} != tag ${tag}`);
            if (pkg !== tag) problems.push(`package.json version ${pkg} != tag ${tag}`);
            if (lock !== tag) problems.push(`package-lock.json version ${lock} != tag ${tag}`);
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) problems.push(`versions.json has no entry for ${tag}`);
            if (problems.length > 0) {
              console.error(`::error::Version check failed: ${problems.join("; ")}`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" main.js manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json --generate-notes
          fi
